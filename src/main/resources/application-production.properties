spring.datasource.url=${AUCTION_QUERY_DB_URL:${DATABASE_JDBC_URL:${SPRING_DATASOURCE_URL}}}
spring.datasource.username=${AUCTION_QUERY_DB_USERNAME:${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}}
spring.datasource.password=${AUCTION_QUERY_DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}}
spring.datasource.hikari.maximum-pool-size=${AUCTION_QUERY_DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=none
