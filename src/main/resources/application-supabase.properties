spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${AUCTION_QUERY_DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:auction_query;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${AUCTION_QUERY_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${AUCTION_QUERY_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=none
